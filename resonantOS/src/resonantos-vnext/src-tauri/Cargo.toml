[package]
name = "resonantos_vnext"
version = "0.1.0"
description = "ResonantOS vNext desktop shell foundation"
authors = ["Resonant Alpha"]
edition = "2021"

[lib]
name = "resonantos_vnext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dashmap = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
libloading = "0.8"
once_cell = "1"
portable-pty = "0.8"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.31"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "rt-multi-thread", "macros"] }
tract-onnx = { version = "0.21", optional = true }
tungstenite = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }
mdns-sd = "0.11"
rmp-serde = "1"

[features]
default = []
tract-onnx = ["dep:tract-onnx"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
